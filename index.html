<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Evitar caché en navegadores móviles -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Vittoria | Belleza & Fragancias</title>
    <link rel="stylesheet" href="styles.css?v=6.0">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- Pantalla de Bienvenida (Splash Screen) -->
    <div id="splash-overlay">
        <img src="vittoria_premium_logo_1778113391456.png" class="splash-logo" alt="Vittoria Logo">
        <div class="loader-bar-container">
            <div class="loader-bar"></div>
        </div>
    </div>

    <div class="container">
        <header>
            <div class="brand-badge">Nueva Temporada</div>
            <h1 class="brand-logo">Vittoria</h1>
            <p class="brand-subtitle">Belleza & Fragancias</p>
        </header>

        <main>

            <div id="catalog-list" class="catalog-grid">
                <!-- Los catálogos se cargarán dinámicamente aquí -->
                <div class="loading-state" style="text-align: center; padding: 40px; color: var(--text-secondary);">
                    Cargando catálogos...
                </div>
            </div>

            <div class="order-section">
                <p style="margin-bottom: 15px; font-size: 0.9rem; color: var(--text-secondary);">
                    ¿Lista para hacer un pedido?
                </p>
                <a href="https://wa.me/5491134920111?text=Hola%20Victoria,%20vengo%20de%20tu%20web%20y%20me%20gustar%C3%ADa%20hacer%20un%20pedido." class="btn-whatsapp" id="whatsapp-btn">
                    <i data-lucide="message-circle"></i>
                    Enviar Pedido por WhatsApp
                </a>
            </div>
        </main>

        <footer>
            <p>© 2026 Vittoria - Todos los derechos reservados</p>
            <p style="margin-top: 5px; opacity: 0.5;">Powered by Goto10.com.ar</p>
        </footer>
    </div>

    <!-- Botón Flotante de WhatsApp (Premium UI/UX) -->
    <a href="https://wa.me/5491134920111?text=Hola%20Victoria,%20vengo%20de%20tu%20web%20y%20me%20gustar%C3%ADa%20hacer%20un%20pedido." class="whatsapp-float" id="whatsapp-float-btn" target="_blank" aria-label="Enviar un mensaje directo por WhatsApp">
        <i data-lucide="message-circle"></i>
    </a>

    <!-- Modal del Visor de Catálogos (Premium UX/UI) -->
    <div id="catalog-modal" class="catalog-modal" aria-hidden="true" role="dialog">
        <div class="modal-header">
            <h2 id="modal-catalog-title">Catálogo</h2>
            <button class="btn-close-modal" id="close-modal-btn" aria-label="Cerrar visor de catálogo">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div class="modal-body">
            <div id="modal-loader" class="modal-loader">
                <div class="spinner"></div>
                <p>Cargando catálogo...</p>
            </div>
            <iframe id="catalog-iframe" src="" frameborder="0" allow="autoplay"></iframe>
        </div>
        <div class="modal-footer">
            <a id="modal-external-link" href="#" target="_blank" class="btn-external" aria-label="Ver el catálogo en pantalla completa en una nueva pestaña">
                <i data-lucide="external-link"></i> Abrir pantalla completa
            </a>
        </div>
    </div>

    <script src="app.js?v=6.0"></script>
    <script>
        // Inicializar iconos de Lucide
        lucide.createIcons();
    </script>
</body>
</html>
