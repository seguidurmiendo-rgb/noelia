<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vittoria | Belleza & Fragancias</title>
    <link rel="stylesheet" href="styles.css?v=2.0">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- Pantalla de Bienvenida (Splash Screen) -->
    <div id="splash-overlay">
        <img src="vittoria_premium_logo_1778113391456.png" class="splash-logo" alt="Vittoria Logo">
        <div class="loader-bar-container">
            <div class="loader-bar"></div>
        </div>
    </div>

    <div class="container">
        <header>
            <div class="brand-badge">Nueva Temporada</div>
            <h1 class="brand-logo">Vittoria</h1>
            <p class="brand-subtitle">Belleza & Fragancias</p>
        </header>

        <main>

            <div id="catalog-list" class="catalog-grid">
                <!-- Los catálogos se cargarán dinámicamente aquí -->
                <div class="loading-state" style="text-align: center; padding: 40px; color: var(--text-secondary);">
                    Cargando catálogos...
                </div>
            </div>

            <div class="order-section">
                <p style="margin-bottom: 15px; font-size: 0.9rem; color: var(--text-secondary);">
                    ¿Lista para hacer un pedido?
                </p>
                <a href="https://wa.me/5491134920111?text=Hola%20Victoria,%20vengo%20de%20tu%20web%20y%20me%20gustar%C3%ADa%20hacer%20un%20pedido." class="btn-whatsapp" id="whatsapp-btn">
                    <i data-lucide="message-circle"></i>
                    Enviar Pedido por WhatsApp
                </a>
            </div>
        </main>

        <footer>
            <p>© 2026 Vittoria - Todos los derechos reservados</p>
            <p style="margin-top: 5px; opacity: 0.5;">Powered by Goto10.com.ar</p>
        </footer>
    </div>

    <script src="app.js"></script>
    <script>
        // Inicializar iconos de Lucide
        lucide.createIcons();
    </script>
</body>
</html>
